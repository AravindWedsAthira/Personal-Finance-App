<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passbook - Personal Finance Manager</title>
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- Navigation / Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Passbook Finance</a>
            <div id="auth-status" class="text-light"></div>
        </div>
    </nav>

    <div class="container">

        <!-- Authentication Section (Hidden once logged in) -->
        <div id="auth-section" class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h3 class="mb-3 text-center">Login / Register</h3>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button id="login-btn" class="btn btn-primary w-100 mb-2">Login</button>
                    <button id="register-btn" class="btn btn-secondary w-100">Register</button>
                </div>
            </div>
        </div>

        <!-- Main Dashboard (Visible only when logged in) -->
        <div id="dashboard-section" style="display: none;">
            
            <div class="row">
                <!-- Management Columns -->
                <div class="col-md-4">
                    <!-- Accounts Card -->
                    <div class="card p-3">
                        <h4>Accounts</h4>
                        <form id="account-form">
                            <input type="hidden" id="account-id">
                            <div class="mb-2">
                                <input type="text" class="form-control" id="account-name" placeholder="Account Name (e.g. Bank, Cash)" required>
                            </div>
                            <button type="submit" class="btn btn-success btn-sm w-100" id="account-submit-btn">Add Account</button>
                        </form>
                        <ul id="accounts-list" class="list-group mt-3"></ul>
                    </div>
                </div>

                <div class="col-md-4">
                    <!-- Categories Card -->
                    <div class="card p-3">
                        <h4>Categories</h4>
                        <form id="category-form">
                            <input type="hidden" id="category-id">
                            <div class="mb-2">
                                <input type="text" class="form-control" id="category-name" placeholder="Category Name (e.g. Food)" required>
                            </div>
                            <button type="submit" class="btn btn-success btn-sm w-100" id="category-submit-btn">Add Category</button>
                        </form>
                        <ul id="categories-list" class="list-group mt-3"></ul>
                    </div>
                </div>

                <div class="col-md-4">
                    <!-- Transactions / Expenses Card -->
                    <div class="card p-3">
                        <h4>Transactions</h4>
                        <form id="transaction-form">
                            <input type="hidden" id="transaction-id">
                            <div class="mb-2">
                                <input type="number" class="form-control" id="trans-amount" placeholder="Amount" required>
                            </div>
                            <div class="mb-2">
                                <select class="form-control" id="trans-type" required>
                                    <option value="Expense">Expense</option>
                                    <option value="Income">Income</option>
                                </select>
                            </div>
                            <div class="mb-2">
                                <select class="form-control" id="trans-account" required>
                                    <option value="">Select Account</option>
                                </select>
                            </div>
                            <div class="mb-2">
                                <select class="form-control" id="trans-category" required>
                                    <option value="">Select Category</option>
                                </select>
                            </div>
                            <div class="mb-2">
                                <input type="date" class="form-control" id="trans-date" required>
                            </div>
                            <button type="submit" class="btn btn-success btn-sm w-100" id="trans-submit-btn">Add Transaction</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Transactions Log Table -->
            <div class="row mt-4">
                <div class="col-12">
                    <div class="card p-3">
                        <h4>Expense Logs</h4>
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Type</th>
                                        <th>Amount</th>
                                        <th>Account</th>
                                        <th>Category</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="transactions-table-body">
                                    <!-- Dynamic rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center mt-3">
                <button id="logout-btn" class="btn btn-danger">Logout</button>
            </div>
        </div>

    </div>

    <!-- Firebase SDK Setup & Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, push, remove, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Your web app's Firebase configuration ( pulled from your project settings )
        const firebaseConfig = {
            apiKey: "AIzaSyDeV2ddLzeq1c4bOCKZyYhSVqefMlKTcU",
            authDomain: "passbook-229d7.firebaseapp.com",
            databaseURL: "https://passbook-229d7-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "passbook-229d7",
            storageBucket: "passbook-229d7.appspot.com",
            messagingSenderId: "1020688201249",
            appId: "1:1020688201249:web:57d47547d594/1f303d560"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;

        // Elements
        const authSection = document.getElementById('auth-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const authStatus = document.getElementById('auth-status');

        // Auth State Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authSection.style.display = 'none';
                dashboardSection.style.display = 'block';
                authStatus.innerText = `Logged in as: ${user.email}`;
                loadUserData(user.uid);
            } else {
                currentUser = null;
                authSection.style.display = 'block';
                dashboardSection.style.display = 'none';
                authStatus.innerText = '';
            }
        });

        // Login / Register Handlers
        document.getElementById('login-btn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, pass).catch(err => alert(err.message));
        });

        document.getElementById('register-btn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            createUserWithEmailAndPassword(auth, email, pass).catch(err => alert(err.message));
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth);
        });

        // Load data dynamically per user
        function loadUserData(uid) {
            // Accounts
            const accountsRef = ref(db, `users/${uid}/accounts`);
            onValue(accountsRef, (snapshot) => {
                const data = snapshot.val();
                const list = document.getElementById('accounts-list');
                const select = document.getElementById('trans-account');
                list.innerHTML = '';
                select.innerHTML = '<option value="">Select Account</option>';
                
                if (data) {
                    Object.entries(data).forEach(([id, val]) => {
                        list.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
                            ${val.name}
                            <div>
                                <button class="btn btn-sm btn-warning me-1" onclick="editAccount('${id}', '${val.name}')">Edit</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteData('accounts', '${id}')">Delete</button>
                            </div>
                        </li>`;
                        select.innerHTML += `<option value="${val.name}">${val.name}</option>`;
                    });
                }
            });

            // Categories
            const categoriesRef = ref(db, `users/${uid}/categories`);
            onValue(categoriesRef, (snapshot) => {
                const data = snapshot.val();
                const list = document.getElementById('categories-list');
                const select = document.getElementById('trans-category');
                list.innerHTML = '';
                select.innerHTML = '<option value="">Select Category</option>';
                
                if (data) {
                    Object.entries(data).forEach(([id, val]) => {
                        list.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
                            ${val.name}
                            <div>
                                <button class="btn btn-sm btn-warning me-1" onclick="editCategory('${id}', '${val.name}')">Edit</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteData('categories', '${id}')">Delete</button>
                            </div>
                        </li>`;
                        select.innerHTML += `<option value="${val.name}">${val.name}</option>`;
                    });
                }
            });

            // Transactions
            const transRef = ref(db, `users/${uid}/transactions`);
            onValue(transRef, (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById('transactions-table-body');
                tbody.innerHTML = '';
                
                if (data) {
                    Object.entries(data).forEach(([id, val]) => {
                        tbody.innerHTML += `<tr>
                            <td>${val.date}</td>
                            <td>${val.type}</td>
                            <td>${val.amount}</td>
                            <td>${val.account}</td>
                            <td>${val.category}</td>
                            <td>
                                <button class="btn btn-sm btn-warning me-1" onclick="editTransaction('${id}', '${val.amount}', '${val.type}', '${val.account}', '${val.category}', '${val.date}')">Edit</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteData('transactions', '${id}')">Delete</button>
                            </td>
                        </tr>`;
                    });
                }
            });
        }

        // Add / Edit Account Form
        document.getElementById('account-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('account-id').value;
            const name = document.getElementById('account-name').value;
            const accountRef = ref(db, `users/${currentUser.uid}/accounts`);

            if (id) {
                update(ref(db, `users/${currentUser.uid}/accounts/${id}`), { name }).then(() => {
                    resetAccountForm();
                });
            } else {
                push(accountRef, { name }).then(() => {
                    resetAccountForm();
                });
            }
        });

        window.editAccount = (id, name) => {
            document.getElementById('account-id').value = id;
            document.getElementById('account-name').value = name;
            document.getElementById('account-submit-btn').innerText = 'Update Account';
        };

        function resetAccountForm() {
            document.getElementById('account-id').value = '';
            document.getElementById('account-name').value = '';
            document.getElementById('account-submit-btn').innerText = 'Add Account';
        }

        // Add / Edit Category Form
        document.getElementById('category-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('category-id').value;
            const name = document.getElementById('category-name').value;
            const catRef = ref(db, `users/${currentUser.uid}/categories`);

            if (id) {
                update(ref(db, `users/${currentUser.uid}/categories/${id}`), { name }).then(() => {
                    resetCategoryForm();
                });
            } else {
                push(catRef, { name }).then(() => {
                    resetCategoryForm();
                });
            }
        });

        window.editCategory = (id, name) => {
            document.getElementById('category-id').value = id;
            document.getElementById('category-name').value = name;
            document.getElementById('category-submit-btn').innerText = 'Update Category';
        };

        function resetCategoryForm() {
            document.getElementById('category-id').value = '';
            document.getElementById('category-name').value = '';
            document.getElementById('category-submit-btn').innerText = 'Add Category';
        }

        // Add / Edit Transaction Form
        document.getElementById('transaction-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('transaction-id').value;
            const amount = document.getElementById('trans-amount').value;
            const type = document.getElementById('trans-type').value;
            const account = document.getElementById('trans-account').value;
            const category = document.getElementById('trans-category').value;
            const date = document.getElementById('trans-date').value;
            const transRef = ref(db, `users/${currentUser.uid}/transactions`);

            const payload = { amount, type, account, category, date };

            if (id) {
                update(ref(db, `users/${currentUser.uid}/transactions/${id}`), payload).then(() => {
                    resetTransForm();
                });
            } else {
                push(transRef, payload).then(() => {
                    resetTransForm();
                });
            }
        });

        window.editTransaction = (id, amount, type, account, category, date) => {
            document.getElementById('transaction-id').value = id;
            document.getElementById('trans-amount').value = amount;
            document.getElementById('trans-type').value = type;
            document.getElementById('trans-account').value = account;
            document.getElementById('trans-category').value = category;
            document.getElementById('trans-date').value = date;
            document.getElementById('trans-submit-btn').innerText = 'Update Transaction';
        };

        function resetTransForm() {
            document.getElementById('transaction-id').value = '';
            document.getElementById('transaction-form').reset();
            document.getElementById('trans-submit-btn').innerText = 'Add Transaction';
        }

        // Global Delete Function
        window.deleteData = (type, id) => {
            if (confirm("Are you sure you want to delete this item?")) {
                remove(ref(db, `users/${currentUser.uid}/${type}/${id}`));
            }
        };
    </script>
</body>
</html>
