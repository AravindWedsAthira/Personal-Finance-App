<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDeV2ddLzeq4c4bDGKYrYVh5vqefMHKTtU",
      authDomain: "passbook-229d7.firebaseapp.com",
      databaseURL: "https://passbook-229d7-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "passbook-229d7",
      storageBucket: "passbook-229d7.firebasestorage.app",
      messagingSenderId: "1020688201249",
      appId: "1:1020688201249:web:57d42542d59471f303d560"
    };

    let app, db;
    try {
        app = initializeApp(firebaseConfig);
        db = getDatabase(app);
    } catch (e) {
        console.error("Firebase Initialization Error:", e);
    }

    let appState = {
        theme: 'dark',
        type: 'Expense',
        selectedAccount: null,
        selectedCategory: null,
        calcInput: '0',
        categories: [
            { id: 1, name: 'Food & Dining', subs: ['Groceries', 'Restaurants', 'Fast Food', 'Coffee'] },
            { id: 2, name: 'Bills & Utilities', subs: ['Electricity', 'Water', 'Internet', 'Mobile Recharge'] },
            { id: 3, name: 'Shopping', subs: ['Clothing', 'Electronics', 'Home Decor'] }
        ],
        accounts: [
            { id: 1, type: 'Savings', name: 'HDFC Salary A/c', balance: 45000, source: '' },
            { id: 2, type: 'RD', name: 'SBI Monthly RD', balance: 5000, source: 'HDFC Salary A/c' },
            { id: 3, type: 'FD', name: 'ICICI Tax Saver FD', balance: 100000, source: 'HDFC Salary A/c' }
        ],
        investments: [
            { id: 1, type: 'Mutual Fund SIP', name: 'Parag Parikh Flexi Cap', category: 'Equity', amount: 10000 },
            { id: 2, type: 'Stock', name: 'TCS', category: 'Information Technology', amount: 25000 }
        ],
        cards: [
            { id: 1, name: 'HDFC Regalia', limit: 200000, due: 12450, duedate: '2026-08-15', emis: 'iPhone EMI - ₹5000/mo' }
        ],
        wallets: [
            { id: 1, name: 'Paytm Wallet', balance: 1200 },
            { id: 2, name: 'Pocket Cash', balance: 800 }
        ],
        recurring: [
            { id: 1, name: 'Netflix Subscription', freq: 'Monthly', amount: 649, source: 'HDFC Regalia' },
            { id: 2, name: 'Life Insurance Premium', freq: 'Yearly', amount: 12000, source: 'HDFC Salary A/c' }
        ],
        transactions: [
            { id: 1, date: '2026-07-30', type: 'Expense', amount: 650, account: 'HDFC Salary A/c', category: 'Groceries' }
        ],
        budgets: [
            { category: 'Food & Dining', period: 'Monthly', limit: 12000 }
        ]
    };

    let isSyncingFromDB = false;

    if (db) {
        const stateRef = ref(db, 'passbook_state');
        onValue(stateRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                isSyncingFromDB = true;
                appState = { ...appState, ...data };
                // Ensure arrays are never undefined from partial DB states
                if(!appState.categories) appState.categories = [];
                if(!appState.accounts) appState.accounts = [];
                if(!appState.investments) appState.investments = [];
                if(!appState.cards) appState.cards = [];
                if(!appState.wallets) appState.wallets = [];
                if(!appState.recurring) appState.recurring = [];
                if(!appState.transactions) appState.transactions = [];
                if(!appState.budgets) appState.budgets = [];

                document.documentElement.setAttribute('data-bs-theme', appState.theme || 'dark');
                renderAll();
                isSyncingFromDB = false;
                const statusEl = document.getElementById('db-status');
                if(statusEl) statusEl.innerHTML = '<i class="bi bi-circle-fill fs-7"></i> Realtime DB Connected';
            } else {
                syncToFirebase();
            }
        }, (error) => {
            const statusEl = document.getElementById('db-status');
            if(statusEl) statusEl.innerHTML = '<i class="bi bi-exclamation-circle-fill fs-7 text-danger"></i> DB Sync Failed';
            console.error(error);
        });
    }

    function syncToFirebase() {
        renderAll();
        if (db && !isSyncingFromDB) {
            set(ref(db, 'passbook_state'), appState).catch((err) => console.error("Firebase write error:", err));
        }
    }

    // Event Listeners setup with safety checks
    const sidebarCollapse = document.getElementById('sidebarCollapse');
    if(sidebarCollapse) sidebarCollapse.addEventListener('click', () => {
        document.getElementById('sidebar')?.classList.toggle('active');
    });

    const sidebarClose = document.getElementById('sidebarClose');
    if(sidebarClose) sidebarClose.addEventListener('click', () => {
        document.getElementById('sidebar')?.classList.remove('active');
    });

    window.switchSection = function(sectionId, el) {
        document.querySelectorAll('.section-view').forEach(s => s.classList.remove('active'));
        const target = document.getElementById('section-' + sectionId);
        if(target) target.classList.add('active');
        
        document.querySelectorAll('#sidebar ul li').forEach(li => li.classList.remove('active'));
        if(el && el.parentElement) el.parentElement.classList.add('active');
        
        const titleEl = document.getElementById('page-title');
        const targetTitle = target?.querySelector('h4')?.innerText;
        if(titleEl && targetTitle) titleEl.innerText = targetTitle;

        if(window.innerWidth < 768) document.getElementById('sidebar')?.classList.remove('active');
        renderAll();
    }

    window.toggleTheme = function() {
        appState.theme = appState.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-bs-theme', appState.theme);
        const icon = document.getElementById('theme-icon');
        if(icon) icon.className = appState.theme === 'dark' ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
        syncToFirebase();
    }

    window.setAppType = function(type) {
        appState.type = type;
        ['income', 'expense', 'transfer'].forEach(t => {
            const btn = document.getElementById('type-' + t);
            if(btn) {
                btn.classList.remove('active');
                btn.innerHTML = t.toUpperCase();
            }
        });
        const activeEl = document.getElementById('type-' + type.toLowerCase());
        if(activeEl) {
            activeEl.classList.add('active');
            activeEl.innerHTML = `<i class="bi bi-check-circle-fill"></i> ${type.toUpperCase()}`;
        }
        
        const selectorsContainer = document.getElementById('selectors-container');
        if(selectorsContainer) {
            if(type === 'Transfer') {
                selectorsContainer.innerHTML = `
                    <div class="col-6"><div class="selector-box" onclick="openAccountModal('source')"><span id="selected-source-label" class="text-truncate">From A/c</span><i class="bi bi-chevron-right text-muted small"></i></div></div>
                    <div class="col-6"><div class="selector-box" onclick="openAccountModal('destination')"><span id="selected-dest-label" class="text-truncate">To A/c</span><i class="bi bi-chevron-right text-muted small"></i></div></div>
                `;
            } else {
                selectorsContainer.innerHTML = `
                    <div class="col-6"><div class="selector-box" onclick="openAccountModal('primary')"><div class="d-flex align-items-center gap-2 text-truncate"><i class="bi bi-wallet2 text-primary fs-5"></i><span id="selected-account-label" class="text-truncate">Account</span></div><i class="bi bi-chevron-right text-muted small"></i></div></div>
                    <div class="col-6"><div class="selector-box" onclick="openCategoryModal()"><div class="d-flex align-items-center gap-2 text-truncate"><i class="bi bi-tag text-primary fs-5"></i><span id="selected-category-label" class="text-truncate">Subcategory</span></div><i class="bi bi-chevron-right text-muted small"></i></div></div>
                `;
            }
        }
    }

    window.appendCalc = function(val) {
        if(appState.calcInput === '0' && val !== '.') appState.calcInput = val;
        else appState.calcInput += val;
        const display = document.getElementById('calc-display');
        if(display) display.innerText = appState.calcInput;
    }

    window.calculateResult = function() {
        try {
            let res = eval(appState.calcInput);
            appState.calcInput = String(res);
            const display = document.getElementById('calc-display');
            if(display) display.innerText = appState.calcInput;
        } catch(e) {
            const display = document.getElementById('calc-display');
            if(display) display.innerText = 'Error';
            appState.calcInput = '0';
        }
    }

    window.resetAppInput = function() {
        appState.calcInput = '0';
        const display = document.getElementById('calc-display');
        if(display) display.innerText = '0';
        const notes = document.getElementById('app-notes');
        if(notes) notes.value = '';
    }

    let activeAccountModalMode = 'primary';
    window.openAccountModal = function(mode) {
        activeAccountModalMode = mode;
        const titleEl = document.getElementById('account-modal-title');
        if(titleEl) titleEl.innerText = mode === 'source' ? 'Select Source Account' : (mode === 'destination' ? 'Select Destination Account' : 'Select Account / Wallet / Card');
        
        let listHTML = '';
        (appState.accounts || []).forEach(acc => {
            listHTML += `<div class="account-select-row" onclick="selectAccount('${acc.name}')"><span>${acc.name} (${acc.type})</span><span class="text-primary fw-bold">₹${acc.balance}</span></div>`;
        });
        (appState.wallets || []).forEach(w => {
            listHTML += `<div class="account-select-row" onclick="selectAccount('${w.name}')"><span>${w.name} (Wallet)</span><span class="text-primary fw-bold">₹${w.balance}</span></div>`;
        });
        (appState.cards || []).forEach(c => {
            listHTML += `<div class="account-select-row" onclick="selectAccount('${c.name}')"><span>${c.name} (Credit Card)</span><span class="text-danger fw-bold">Due: ₹${c.due}</span></div>`;
        });
        
        const modalList = document.getElementById('account-modal-list');
        if(modalList) modalList.innerHTML = listHTML;
        const modal = document.getElementById('account-modal');
        if(modal) modal.style.display = 'flex';
    }
    window.closeAccountModal = function() { 
        const modal = document.getElementById('account-modal');
        if(modal) modal.style.display = 'none'; 
    }
    window.selectAccount = function(name) {
        if(activeAccountModalMode === 'source') {
            const el = document.getElementById('selected-source-label');
            if(el) el.innerText = name;
        } else if(activeAccountModalMode === 'destination') {
            const el = document.getElementById('selected-dest-label');
            if(el) el.innerText = name;
        } else {
            const el = document.getElementById('selected-account-label');
            if(el) el.innerText = name;
        }
        closeAccountModal();
    }

    window.openCategoryModal = function() {
        let listHTML = '';
        (appState.categories || []).forEach(cat => {
            listHTML += `<div class="p-2 fw-bold text-primary border-bottom">${cat.name}</div>`;
            (cat.subs || []).forEach(sub => {
                listHTML += `<button type="button" class="list-group-item list-group-item-action ps-4" onclick="selectCategory('${sub}')">${sub}</button>`;
            });
        });
        const modalList = document.getElementById('category-modal-list');
        if(modalList) modalList.innerHTML = listHTML;
        const modal = document.getElementById('category-modal');
        if(modal) modal.style.display = 'flex';
    }
    window.closeCategoryModal = function() { 
        const modal = document.getElementById('category-modal');
        if(modal) modal.style.display = 'none'; 
    }
    window.selectCategory = function(sub) {
        const label = document.getElementById('selected-category-label');
        if(label) label.innerText = sub;
        const notes = document.getElementById('app-notes');
        if(notes) notes.value = sub;
        closeCategoryModal();
    }

    window.submitAppTransaction = function() {
        let amt = parseFloat(appState.calcInput);
        if(isNaN(amt) || amt <= 0) { alert('Enter valid amount'); return; }
        
        let accountName = 'Default Account';
        if(appState.type === 'Transfer') {
            const src = document.getElementById('selected-source-label')?.innerText || 'Source';
            const dst = document.getElementById('selected-dest-label')?.innerText || 'Destination';
            accountName = `${src} -> ${dst}`;
        } else {
            accountName = document.getElementById('selected-account-label')?.innerText || 'Account';
        }
        
        let subcat = document.getElementById('app-notes')?.value || 'General';

        if(!appState.transactions) appState.transactions = [];
        appState.transactions.unshift({
            id: Date.now(),
            date: new Date().toISOString().split('T')[0],
            type: appState.type,
            amount: amt,
            account: accountName,
            category: subcat
        });
        resetAppInput();
        syncToFirebase();
        alert('Transaction saved successfully!');
    }

    // Master Form Event Submissions with Null-checks
    const catForm = document.getElementById('category-form');
    if(catForm) {
        catForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let id = document.getElementById('cat-id')?.value;
            let name = document.getElementById('cat-name')?.value;
            let subs = (document.getElementById('cat-sub')?.value || '').split(',').map(s => s.trim()).filter(s => s);
            
            if(!appState.categories) appState.categories = [];
            if(id) {
                let cat = appState.categories.find(c => c.id == id);
                if(cat) { cat.name = name; cat.subs = subs; }
            } else {
                appState.categories.push({ id: Date.now(), name, subs });
            }
            resetCategoryForm();
            syncToFirebase();
        });
    }

    window.editCategory = function(id) {
        let cat = (appState.categories || []).find(c => c.id == id);
        if(!cat) return;
        document.getElementById('cat-id').value = cat.id;
        document.getElementById('cat-name').value = cat.name;
        document.getElementById('cat-sub').value = (cat.subs || []).join(', ');
        document.getElementById('cat-form-title').innerText = 'Edit Category';
        document.getElementById('cat-submit-btn').innerText = 'Update Category';
        document.getElementById('cat-cancel-edit').style.display = 'block';
    }
    window.resetCategoryForm = function() {
        catForm?.reset();
        if(document.getElementById('cat-id')) document.getElementById('cat-id').value = '';
        if(document.getElementById('cat-form-title')) document.getElementById('cat-form-title').innerText = 'Manage Categories';
        if(document.getElementById('cat-submit-btn')) document.getElementById('cat-submit-btn').innerText = 'Save Category';
        if(document.getElementById('cat-cancel-edit')) document.getElementById('cat-cancel-edit').style.display = 'none';
    }
    window.deleteCategory = function(id) {
        appState.categories = (appState.categories || []).filter(c => c.id != id);
        syncToFirebase();
    }

    window.toggleDepositLinkFields = function() {
        let type = document.getElementById('acc-type')?.value;
        let group = document.getElementById('deposit-link-group');
        if(group) group.style.display = (type === 'RD' || type === 'FD') ? 'block' : 'none';
    }

    const accForm = document.getElementById('account-form');
    if(accForm) {
        accForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let id = document.getElementById('acc-id')?.value;
            let type = document.getElementById('acc-type')?.value;
            let name = document.getElementById('acc-name')?.value;
            let balance = parseFloat(document.getElementById('acc-balance')?.value || 0);
            let source = (type === 'RD' || type === 'FD') ? document.getElementById('acc-linked-source')?.value : '';

            if(!appState.accounts) appState.accounts = [];
            if(id) {
                let acc = appState.accounts.find(a => a.id == id);
                if(acc) { acc.type = type; acc.name = name; acc.balance = balance; acc.source = source; }
            } else {
                appState.accounts.push({ id: Date.now(), type, name, balance, source });
            }
            resetAccountForm();
            syncToFirebase();
        });
    }

    window.editAccount = function(id) {
        let acc = (appState.accounts || []).find(a => a.id == id);
        if(!acc) return;
        document.getElementById('acc-id').value = acc.id;
        document.getElementById('acc-type').value = acc.type;
        document.getElementById('acc-name').value = acc.name;
        document.getElementById('acc-balance').value = acc.balance;
        const linkedSource = document.getElementById('acc-linked-source');
        if(linkedSource) linkedSource.value = acc.source || '';
        toggleDepositLinkFields();
        document.getElementById('acc-form-title').innerText = 'Edit Bank / Deposit';
        document.getElementById('acc-submit-btn').innerText = 'Update Account';
        document.getElementById('acc-cancel-edit').style.display = 'block';
    }
    window.resetAccountForm = function() {
        accForm?.reset();
        if(document.getElementById('acc-id')) document.getElementById('acc-id').value = '';
        const group = document.getElementById('deposit-link-group');
        if(group) group.style.display = 'none';
        if(document.getElementById('acc-form-title')) document.getElementById('acc-form-title').innerText = 'Add Bank / Account / RD / FD';
        if(document.getElementById('acc-submit-btn')) document.getElementById('acc-submit-btn').innerText = 'Save Account';
        if(document.getElementById('acc-cancel-edit')) document.getElementById('acc-cancel-edit').style.display = 'none';
    }
    window.deleteAccount = function(id) {
        appState.accounts = (appState.accounts || []).filter(a => a.id != id);
        syncToFirebase();
    }

    const invForm = document.getElementById('investment-form');
    if(invForm) {
        invForm.addEventListener('submit', (e) => {

            let id = document.getElementById('inv-id')?.value;

            let category = document.getElementById('inv-category')?.value;
            let amount = parseFloat(document.getElementById('inv-amount')?.value || 0);

            if(!appState.investments) appState.investments = [];
            if(id) {
                let inv = appState.investments.find(i => i.id == id);
                if(inv) { inv.type = type; inv.name = name; inv.category = category; inv.amount = amount; }
            } else {
                appState.investments.push({ id: Date.now(), type, name, category, amount });
            }
            resetInvestmentForm();
            syncToFirebase();
        });
    }

        document.getElementById('inv-submit-btn').innerText = 'Update Investment';
        document.getElementById('inv-cancel-edit').style.display = 'block';
    }
    window.resetInvestmentForm = function() {
        invForm?.reset();
        if(document.getElementById('inv-id')) document.getElementById('inv-id').value = '';
        if(document.getElementById('inv-form-title')) document.getElementById('inv-form-title').innerText = 'Add Investment';
        if(document.getElementById('inv-submit-btn')) document.getElementById('inv-submit-btn').innerText = 'Save Investment';
        if(document.getElementById('inv-cancel-edit')) document.getElementById('inv-cancel-edit').style.display = 'none';
    }

        syncToFirebase();

    const cardForm = document.getElementById('card-form');
    if(cardForm) {
        cardForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let id = document.getElementById('card-id')?.value;
            let name = document.getElementById('card-name')?.value;
            let limit = parseFloat(document.getElementById('card-limit')?.value || 0);
            let due = parseFloat(document.getElementById('card-due')?.value || 0);
            let duedate = document.getElementById('card-duedate')?.value;
            let emis = document.getElementById('card-emis')?.value;

            if(!appState.cards) appState.cards = [];
            if(id) {
                let card = appState.cards.find(c => c.id == id);
                if(card) { card.name = name; card.limit = limit; card.due = due; card.duedate = duedate; card.emis = emis; }
            } else {

    window.editCard = function(id) {
        let card = (appState.cards || []).find(c => c.id == id);
        if(!card) return;
        document.getElementById('card-id').value = card.id;
        document.getElementById('card-name').value = card.name;
        document.getElementById('card-limit').value = card.limit;
        document.getElementById('card-due').value = card.due;
        document.getElementById('card-duedate').value = card.duedate;
        document.getElementById('card-emis').value = card.emis;
        document.getElementById('card-form-title').innerText = 'Edit Credit Card / EMI';
        document.getElementById('card-submit-btn').innerText = 'Update Card';
        document.getElementById('card-cancel-edit').style.display = 'block';
    }
    window.resetCardForm = function() {
        cardForm?.reset();
        if(document.getElementById('card-id')) document.getElementById('card-id').value = '';
        if(document.getElementById('card-form-title')) document.getElementById('card-form-title').innerText = 'Add Credit Card / EMI';
        if(document.getElementById('card-submit-btn')) document.getElementById('card-submit-btn').innerText = 'Save Card';
        if(document.getElementById('card-cancel-edit')) document.getElementById('card-cancel-edit').style.display = 'none';
    }
    window.deleteCard = function(id) {

    const walletForm = document.getElementById('wallet-form');
    if(walletForm) {
        walletForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let id = document.getElementById('wallet-id')?.value;
            let name = document.getElementById('wallet-name')?.value;
            let balance = parseFloat(document.getElementById('wallet-balance')?.value || 0);

            if(!appState.wallets) appState.wallets = [];
            if(id) {
                let w = appState.wallets.find(x => x.id == id);
                if(w) { w.name = name; w.balance = balance; }
            } else {
                appState.wallets.push({ id: Date.now(), name, balance });

    window.editWallet = function(id) {
        let w = (appState.wallets || []).find(x => x.id == id);
        if(!w) return;
        document.getElementById('wallet-id').value = w.id;
        document.getElementById('wallet-name').value = w.name;
        document.getElementById('wallet-balance').value = w.balance;
        document.getElementById('wallet-form-title').innerText = 'Edit Cash / Wallet';

        if(document.getElementById('wallet-form-title')) document.getElementById('wallet-form-title').innerText = 'Add Cash / Wallet';

    const recForm = document.getElementById('recurring-form');
    if(recForm) {
        recForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let id = document.getElementById('rec-id')?.value;
            let name = document.getElementById('rec-name')?.value;
            let freq = document.getElementById('rec-freq')?.value;
            let amount = parseFloat(document.getElementById('rec-amount')?.value || 0);
            let source = document.getElementById('rec-source')?.value;

            if(!appState.recurring) appState.recurring = [];
            if(id) {
                let rec = appState.recurring.find(r => r.id == id);
                if(rec) { rec.name = name; rec.freq = freq; rec.amount = amount; rec.source = source; }
            } else {
                appState.recurring.push({ id: Date.now(), name, freq, amount, source });

            resetRecurringForm();
            syncToFirebase();
        });

    window.editRecurring = function(id) {
        let rec = (appState.recurring || []).find(r => r.id == id);
        if(!rec) return;
        document.getElementById('rec-id').value = rec.id;

        document.getElementById('rec-cancel-edit').style.display = 'block';
    }
    window.resetRecurringForm = function() {
        recForm?.reset();
        if(document.getElementById('rec-id')) document.getElementById('rec-id').value = '';
        if(document.getElementById('rec-form-title')) document.getElementById('rec-form-title').innerText = 'Add Recurring Payment';
        if(document.getElementById('rec-submit-btn')) document.getElementById('rec-submit-btn').innerText = 'Save Recurring';
        if(document.getElementById('rec-cancel-edit')) document.getElementById('rec-cancel-edit').style.display = 'none';
    }
    window.deleteRecurring = function(id) {
        appState.recurring = (appState.recurring || []).filter(r => r.id != id);
        syncToFirebase();
    }

    window.deleteTransaction = function(id) {
        appState.transactions = (appState.transactions || []).filter(t => t.id != id);
        syncToFirebase();
    }

    const budgetForm = document.getElementById('budget-form');
    if(budgetForm) {
        budgetForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let category = document.getElementById('budget-category')?.value;
            let period = document.getElementById('budget-period')?.value;
            let limit = parseFloat(document.getElementById('budget-limit')?.value || 0);

            if(!appState.budgets) appState.budgets = [];
            let existing = appState.budgets.find(b => b.category === category && b.period === period);
            if(existing) {
                existing.limit = limit;
            } else {
                appState.budgets.push({ category, period, limit });
            }
            budgetForm.reset();
            syncToFirebase();
        });
    }

    window.deleteBudget = function(category, period) {
        appState.budgets = (appState.budgets || []).filter(b => !(b.category === category && b.period === period));
        syncToFirebase();
    }

    // Master Render Function with strict element verification
    function renderAll() {
        try {
            let txHtml = '';
            (appState.transactions || []).forEach(t => {
                let badgeClass = t.type === 'Income' ? 'bg-success' : (t.type === 'Expense' ? 'bg-danger' : 'bg-info');
                txHtml += `<tr>
                    <td>${t.date}</td>
                    <td><span class="badge ${badgeClass}">${t.type}</span></td>
                    <td class="fw-bold">₹${t.amount}</td>
                    <td>${t.account}</td>
                    <td>${t.category}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteTransaction(${t.id})"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>`;
            });
            const txBody = document.getElementById('transactions-table-body');
            if(txBody) txBody.innerHTML = txHtml || `<tr><td colspan="6" class="text-center text-muted">No transactions logged yet.</td></tr>`;

            let catHtml = '';
            (appState.categories || []).forEach(c => {
                let subsBadge = (c.subs || []).map(s => `<span class="badge-sub">${s}</span>`).join('');
                catHtml += `<div class="list-group-item bg-card mb-2 border rounded p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="fw-bold m-0 text-primary">${c.name}</h5>
                        <div>
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="editCategory(${c.id})"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteCategory(${c.id})"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>
                    <div>${subsBadge}</div>
                </div>`;
            });
            const catList = document.getElementById('categories-list');
            if(catList) catList.innerHTML = catHtml;

            let accHtml = '';
            let savingsSelectOptions = '<option value="">Select Savings Account</option>';
            let allAccSourceOptions = '';
            let budgetCatOptions = '';

            (appState.accounts || []).forEach(a => {
                accHtml += `<tr>
                    <td><span class="badge bg-secondary">${a.type}</span></td>
                    <td class="fw-bold">${a.name}</td>
                    <td>₹${a.balance}</td>
                    <td>${a.source || '-'}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editAccount(${a.id})"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteAccount(${a.id})"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>`;
                if(a.type === 'Savings') savingsSelectOptions += `<option value="${a.name}">${a.name}</option>`;
                allAccSourceOptions += `<option value="${a.name}">${a.name} (${a.type})</option>`;
            });

            (appState.cards || []).forEach(c => {
                allAccSourceOptions += `<option value="${c.name}">${c.name} (Credit Card)</option>`;
            });

            const accTable = document.getElementById('accounts-table-body');
            if(accTable) accTable.innerHTML = accHtml;
            const linkedSrc = document.getElementById('acc-linked-source');
            if(linkedSrc) linkedSrc.innerHTML = savingsSelectOptions;
            const recSrc = document.getElementById('rec-source');
            if(recSrc) recSrc.innerHTML = allAccSourceOptions;

            (appState.categories || []).forEach(c => {
                budgetCatOptions += `<option value="${c.name}">${c.name}</option>`;
            });
            const budgetCat = document.getElementById('budget-category');
            if(budgetCat) budgetCat.innerHTML = budgetCatOptions;

            let invHtml = '';
            (appState.investments || []).forEach(i => {
                invHtml += `<tr>
                    <td><span class="badge bg-primary">${i.type}</span></td>
                    <td class="fw-bold">${i.name}</td>
                    <td>${i.category}</td>
                    <td>₹${i.amount}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editInvestment(${i.id})"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteInvestment(${i.id})"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>`;
            });
            const invTable = document.getElementById('investments-table-body');
            if(invTable) invTable.innerHTML = invHtml;

            let cardHtml = '';
            (appState.cards || []).forEach(c => {
                cardHtml += `<tr>
                    <td class="fw-bold">${c.name}</td>
                    <td>₹${c.limit}</td>
                    <td class="text-danger fw-bold">₹${c.due}</td>
                    <td><span class="badge bg-warning text-dark">${c.duedate}</span></td>
                    <td>${c.emis || '-'}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editCard(${c.id})"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteCard(${c.id})"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>`;
            });
            const cardTable = document.getElementById('cards-table-body');
            if(cardTable) cardTable.innerHTML = cardHtml;

            let walletHtml = '';
            (appState.wallets || []).forEach(w => {
                walletHtml += `<tr>
                    <td class="fw-bold">${w.name}</td>
                    <td>₹${w.balance}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editWallet(${w.id})"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteWallet(${w.id})"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>`;
            });
            const walletTable = document.getElementById('wallets-table-body');
            if(walletTable) walletTable.innerHTML = walletHtml;

            let recHtml = '';
            (appState.recurring || []).forEach(r => {
                recHtml += `<div class="list-group-item bg-card mb-2 border rounded d-flex justify-content-between align-items-center p-3">
                    <div>
                        <h6 class="fw-bold m-0 text-primary">${r.name} <span class="badge bg-secondary ms-2">${r.freq}</span></h6>
                        <small class="text-muted">Debit Source: ${r.source} | Amount: ₹${r.amount}</small>
                    </div>
                    <div>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editRecurring(${r.id})"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteRecurring(${r.id})"><i class="bi bi-trash"></i></button>
                    </div>
                </div>`;
            });
            (appState.accounts || []).filter(a => a.type === 'RD' || a.type === 'FD').forEach(dep => {
                recHtml += `<div class="list-group-item bg-card mb-2 border rounded d-flex justify-content-between align-items-center p-3">
                    <div>
                        <h6 class="fw-bold m-0 text-success">Linked Deposit (${dep.type}): ${dep.name}</h6>
                        <small class="text-muted">Linked Source Savings A/c: ${dep.source || 'None'} | Principal/Balance: ₹${dep.balance}</small>
                    </div>
                    <span class="badge bg-info">Linked Active</span>
                </div>`;
            });
            const recList = document.getElementById('recurring-list');
            if(recList) recList.innerHTML = recHtml || `<div class="text-muted">No recurring payments or linked deposits configured.</div>`;

            let analyticsAcc = '';
            (appState.accounts || []).forEach(a => analyticsAcc += `<div class="list-group-item bg-card d-flex justify-content-between align-items-center"><span>${a.name} (${a.type}) ${a.source ? '<br><small class="text-muted">Linked: '+a.source+'</small>' : ''}</span><span class="fw-bold text-primary">₹${a.balance}</span></div>`);
            (appState.wallets || []).forEach(w => analyticsAcc += `<div class="list-group-item bg-card d-flex justify-content-between align-items-center"><span>${w.name} (Wallet)</span><span class="fw-bold text-primary">₹${w.balance}</span></div>`);
            const analyticsAccList = document.getElementById('analytics-accounts-list');
            if(analyticsAccList) analyticsAccList.innerHTML = analyticsAcc;

            let analyticsCards = '';
            (appState.cards || []).forEach(c => analyticsCards += `<div class="list-group-item bg-card d-flex justify-content-between align-items-center"><div><strong>${c.name}</strong><br><small class="text-muted">Due Date: ${c.duedate}</small></div><span class="fw-bold text-danger">Due: ₹${c.due} / Limit: ₹${c.limit}</span></div>`);
            const analyticsCardsList = document.getElementById('analytics-cards-list');
            if(analyticsCardsList) analyticsCardsList.innerHTML = analyticsCards || '<div class="text-muted">No credit cards added.</div>';

            let catInvMap = {};
            (appState.investments || []).forEach(i => {
                catInvMap[i.category] = (catInvMap[i.category] || 0) + i.amount;
            });
            let analyticsInv = '';
            for(let cat in catInvMap) {
                analyticsInv += `<div class="list-group-item bg-card d-flex justify-content-between align-items-center"><span>${cat}</span><span class="fw-bold text-primary">₹${catInvMap[cat]}</span></div>`;
            }
            const analyticsInvList = document.getElementById('analytics-investments-list');
            if(analyticsInvList) analyticsInvList.innerHTML = analyticsInv || '<div class="text-muted">No investments recorded.</div>';

            let catSpendMap = {};
            (appState.transactions || []).filter(t => t.type === 'Expense').forEach(t => {
                catSpendMap[t.category] = (catSpendMap[t.category] || 0) + t.amount;
            });
            let analyticsSpend = '';
            for(let cat in catSpendMap) {
                analyticsSpend += `<div class="list-group-item bg-card d-flex justify-content-between align-items-center"><span>${cat}</span><span class="fw-bold text-danger">₹${catSpendMap[cat]}</span></div>`;
            }
            const analyticsSpendList = document.getElementById('analytics-spending-list');
            if(analyticsSpendList) analyticsSpendList.innerHTML = analyticsSpend || '<div class="text-muted">No expense logs found.</div>';

            let budgetHtml = '';
            (appState.budgets || []).forEach(b => {
                let spent = 0;
                (appState.transactions || []).filter(t => t.type === 'Expense' && (t.category === b.category)).forEach(t => spent += t.amount);
                let pct = b.limit > 0 ? Math.min(Math.round((spent / b.limit) * 100), 100) : 0;
                let progressColor = pct > 85 ? 'bg-danger' : (pct > 50 ? 'bg-warning' : 'bg-success');
                budgetHtml += `<div class="list-group-item bg-card mb-3 border rounded p-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <h6 class="fw-bold m-0 text-primary">${b.category} (${b.period})</h6>
                        <div>
                            <span class="fw-bold">₹${spent} / ₹${b.limit}</span>
                            <button class="btn btn-sm btn-outline-danger ms-2" onclick="deleteBudget('${b.category}', '${b.period}')"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>
                    <div class="progress" style="height: 8px;">
                        <div class="progress-bar ${progressColor}" role="progressbar" style="width: ${pct}%"></div>
                    </div>
                    <small class="text-muted mt-1 d-block">${pct}% spent of budget limit</small>
                </div>`;
            });
            const budgetTrackingList = document.getElementById('budgets-tracking-list');
            if(budgetTrackingList) budgetTrackingList.innerHTML = budgetHtml || '<div class="text-muted">No budgets configured.</div>';

        } catch (err) {
            console.error("Error during renderAll execution:", err);
        }
    }

    // Initial safe render run
    renderAll();
</script>
