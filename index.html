<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance & Investment Portfolio Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col justify-between">
        
        <!-- Header -->
        <header class="bg-emerald-700 text-white p-4 text-center font-bold text-lg shadow">
            Portfolio Manager
        </header>

        <!-- Main Content Area -->
        <main class="p-4 space-y-6 flex-grow">

            <!-- Bank Accounts Section -->
            <section class="bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-semibold text-gray-700">Bank Accounts</h2>
                    <button onclick="openAddAccountModal()" class="text-xs bg-emerald-600 text-white px-2 py-1 rounded">Add Account</button>
                </div>
                <div id="bankAccountsList" class="space-y-2">
                    <!-- Populated dynamically -->
                </div>
            </section>

            <!-- RD / FD Portfolio Section -->
            <section class="bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-semibold text-gray-700">RD / FD Investments</h2>
                    <button onclick="openAddInvestmentModal()" class="text-xs bg-emerald-600 text-white px-2 py-1 rounded">Add Investment</button>
                </div>
                
                <!-- Table View -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="border-b text-gray-500">
                                <th class="py-2">Type</th>
                                <th class="py-2">Inv / Val</th>
                                <th class="py-2">Rate / Tenure</th>
                                <th class="py-2 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="investmentTableBody">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </section>

        </main>

        <!-- Withdraw / Payout Modal -->
        <div id="withdrawModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-xl max-w-sm w-full p-5 space-y-4 shadow-xl relative">
                <div class="flex justify-between items-center border-b pb-2">
                    <h3 class="font-bold text-blue-600">Premature Withdrawal / Payout</h3>
                    <button onclick="closeWithdrawModal()" class="text-gray-500 font-bold">&times;</button>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Withdraw Amount (₹)</label>
                    <input type="number" id="withdrawAmountInput" class="w-full border rounded p-2 text-sm focus:ring focus:ring-emerald-300">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Deposit into Bank Account</label>
                    <select id="withdrawAccountSelect" class="w-full border rounded p-2 text-sm focus:ring focus:ring-emerald-300">
                        <!-- Populated dynamically -->
                    </select>
                </div>

                <button onclick="confirmWithdrawal()" class="w-full bg-emerald-600 text-white py-2 rounded font-semibold text-sm">Confirm Withdrawal</button>
            </div>
        </div>

        <!-- Add/Edit Bank Account Modal -->
        <div id="bankModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-xl max-w-sm w-full p-5 space-y-4 shadow-xl relative">
                <div class="flex justify-between items-center border-b pb-2">
                    <h3 id="bankModalTitle" class="font-bold text-gray-800">Add Bank Account</h3>
                    <button onclick="closeBankModal()" class="text-gray-500 font-bold">&times;</button>
                </div>
                <input type="hidden" id="editBankId">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Account Name / Bank</label>
                    <input type="text" id="bankNameInput" placeholder="e.g. Axis, SBI" class="w-full border rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Balance (₹)</label>
                    <input type="number" id="bankBalanceInput" placeholder="0" class="w-full border rounded p-2 text-sm">
                </div>
                <button onclick="saveBankDetails()" class="w-full bg-emerald-600 text-white py-2 rounded font-semibold text-sm">Save Account</button>
            </div>
        </div>

        <!-- Add/Edit Investment Modal -->
        <div id="investmentModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-xl max-w-sm w-full p-5 space-y-4 shadow-xl relative">
                <div class="flex justify-between items-center border-b pb-2">
                    <h3 class="font-bold text-gray-800">Add RD / FD Investment</h3>
                    <button onclick="closeInvestmentModal()" class="text-gray-500 font-bold">&times;</button>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Type</label>
                    <select id="invType" class="w-full border rounded p-2 text-sm">
                        <option value="FD">FD</option>
                        <option value="RD">RD</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Invested Amount (₹)</label>
                    <input type="number" id="invInvested" class="w-full border rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Current Value (₹)</label>
                    <input type="number" id="invValue" class="w-full border rounded p-2 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Rate (% p.a.)</label>
                        <input type="number" step="0.01" id="invRate" class="w-full border rounded p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Tenure (mos)</label>
                        <input type="number" id="invTenure" class="w-full border rounded p-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Linked Bank Account</label>
                    <select id="invLinkedBank" class="w-full border rounded p-2 text-sm">
                        <!-- Populated dynamically -->
                    </select>
                </div>
                <button onclick="saveInvestment()" class="w-full bg-emerald-600 text-white py-2 rounded font-semibold text-sm">Save Investment</button>
            </div>
        </div>

        <!-- Footer Navigation bar simulation -->
        <footer class="bg-white border-t p-3 text-center text-xs text-gray-400">
            Secure Local Portfolio Manager
        </footer>

    </div>

    <script>
        // Mock State Data
        let bankAccounts = [
            { id: 1, name: 'Axis', balance: 59 },
            { id: 2, name: 'IDFC', balance: 568 },
            { id: 3, name: 'SBI Joint', balance: 694 }
        ];

        let investments = [
            { id: 101, type: 'FD', invested: 5000, value: 5822, rate: 6.5, tenure: 60, linkedBankId: 1 },
            { id: 102, type: 'FD', invested: 15000, value: 15152, rate: 6.25, tenure: 12, linkedBankId: 2 },
            { id: 103, type: 'RD', invested: 200000, value: 211216, rate: 6.25, tenure: 12, linkedBankId: 3 }
        ];

        let activeWithdrawalInvId = null;

        function init() {
            renderBankAccounts();
            renderInvestments();
        }

        function renderBankAccounts() {
            const container = document.getElementById('bankAccountsList');
            container.innerHTML = '';
            bankAccounts.forEach(acc => {
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-2 rounded border text-sm">
                        <div>
                            <span class="font-medium text-gray-800">${acc.name}</span>
                            <span class="text-emerald-600 font-semibold ml-2">₹${acc.balance}</span>
                        </div>
                        <div class="space-x-1">
                            <button onclick="openEditBankModal(${acc.id})" class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded border border-blue-200">Edit</button>
                            <button onclick="deleteBankAccount(${acc.id})" class="text-xs text-red-500 px-1 py-1">🗑️</button>
                        </div>
                    </div>
                `;
            });
            updateBankDropdowns();
        }

        function renderInvestments() {
            const tbody = document.getElementById('investmentTableBody');
            tbody.innerHTML = '';
            investments.forEach(inv => {
                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="py-3">
                            <span class="bg-gray-700 text-white px-1.5 py-0.5 rounded text-[10px] font-bold">${inv.type}</span>
                        </td>
                        <td class="py-3">
                            <div class="text-gray-500">Inv: ₹${inv.invested.toLocaleString()}</div>
                            <div class="text-emerald-600 font-semibold">Val: ₹${inv.value.toLocaleString()}</div>
                        </td>
                        <td class="py-3">
                            <div>${inv.rate}% p.a.</div>
                            <div class="text-gray-400">${inv.tenure} mos</div>
                        </td>
                        <td class="py-3 text-right">
                            <button onclick="openWithdrawModal(${inv.id})" class="bg-emerald-50 text-emerald-700 border border-emerald-300 px-2.5 py-1 rounded text-xs font-semibold">Withdraw</button>
                        </td>
                    </tr>
                `;
            });
        }

        function updateBankDropdowns() {
            const withdrawSelect = document.getElementById('withdrawAccountSelect');
            const invBankSelect = document.getElementById('invLinkedBank');
            
            let optionsHTML = '<option value="">Select Account</option>';
            bankAccounts.forEach(acc => {
                optionsHTML += `<option value="${acc.id}">${acc.name} (₹${acc.balance})</option>`;
            });

            withdrawSelect.innerHTML = optionsHTML;
            invBankSelect.innerHTML = optionsHTML;
        }

        // Bank Account Modals Logic
        function openAddAccountModal() {
            document.getElementById('bankModalTitle').innerText = 'Add Bank Account';
            document.getElementById('editBankId').value = '';
            document.getElementById('bankNameInput').value = '';
            document.getElementById('bankBalanceInput').value = '';
            document.getElementById('bankModal').classList.remove('hidden');
        }

        function openEditBankModal(id) {
            const acc = bankAccounts.find(a => a.id === id);
            if (!acc) return;
            document.getElementById('bankModalTitle').innerText = 'Edit Bank Account';
            document.getElementById('editBankId').value = acc.id;
            document.getElementById('bankNameInput').value = acc.name;
            document.getElementById('bankBalanceInput').value = acc.balance;
            document.getElementById('bankModal').classList.remove('hidden');
        }

        function closeBankModal() {
            document.getElementById('bankModal').classList.add('hidden');
        }

        function saveBankDetails() {
            const id = document.getElementById('editBankId').value;
            const name = document.getElementById('bankNameInput').value;
            const balance = parseFloat(document.getElementById('bankBalanceInput').value) || 0;

            if (!name) return alert('Please enter an account name');

            if (id) {
                const acc = bankAccounts.find(a => a.id == id);
                if (acc) {
                    acc.name = name;
                    acc.balance = balance;
                }
            } else {
                bankAccounts.push({ id: Date.now(), name, balance });
            }

            closeBankModal();
            init();
        }

        function deleteBankAccount(id) {
            bankAccounts = bankAccounts.filter(a => a.id !== id);
            init();
        }

        // Investment Modal Logic
        function openAddInvestmentModal() {
            document.getElementById('investmentModal').classList.remove('hidden');
        }

        function closeInvestmentModal() {
            document.getElementById('investmentModal').classList.add('hidden');
        }

        function saveInvestment() {
            const type = document.getElementById('invType').value;
            const invested = parseFloat(document.getElementById('invInvested').value) || 0;
            const value = parseFloat(document.getElementById('invValue').value) || 0;
            const rate = parseFloat(document.getElementById('invRate').value) || 0;
            const tenure = parseInt(document.getElementById('invTenure').value) || 0;
            const linkedBankId = parseInt(document.getElementById('invLinkedBank').value);

            if (!linkedBankId) return alert('Please select a linked bank account.');

            investments.push({ id: Date.now(), type, invested, value, rate, tenure, linkedBankId });
            closeInvestmentModal();
            renderInvestments();
        }

        // Withdrawal Payout Modal Logic
        function openWithdrawModal(investmentId) {
            activeWithdrawalInvId = investmentId;
            const inv = investments.find(i => i.id === investmentId);
            if (!inv) return;

            document.getElementById('withdrawAmountInput').value = inv.value;
            
            // Automatically fetch and pre-select the linked account
            const accountSelect = document.getElementById('withdrawAccountSelect');
            accountSelect.value = inv.linkedBankId || "";

            document.getElementById('withdrawModal').classList.remove('hidden');
        }

        function closeWithdrawModal() {
            document.getElementById('withdrawModal').classList.add('hidden');
            activeWithdrawalInvId = null;
        }

        function confirmWithdrawal() {
            const amount = parseFloat(document.getElementById('withdrawAmountInput').value);
            const targetBankId = parseInt(document.getElementById('withdrawAccountSelect').value);

            if (!targetBankId) {
                alert('Please select a target bank account for the payout.');
                return;
            }

            // Update bank account balance
            const bank = bankAccounts.find(b => b.id === targetBankId);
            if (bank) {
                bank.balance += amount;
            }

            // Remove or settle the investment
            investments = investments.filter(i => i.id !== activeWithdrawalInvId);

            closeWithdrawModal();
            init();
            alert(`Successfully withdrawn ₹${amount.toLocaleString()} into ${bank ? bank.name : 'Account'}`);
        }

        // Initial setup
        init();
    </script>
</body>
</html>
